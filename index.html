<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24272b">
<meta name="description" content="SiteTrack - construction finishing progress tracking (Stage 1 prototype)">
<title>SiteTrack · SHA Residence finishing progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2324272b'/%3E%3Cpath d='M8 22V12l8-4 8 4v10' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3Cpath d='M12 22v-6h8v6' stroke='%236fae84' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#24272b; --ink2:#41464d; --mute:#6b7178; --line:#dfe2e6; --soft:#f4f5f7; --paper:#ffffff;
  --green:#2f7d4f; --green2:#6fae84; --amber:#c98a12; --red:#b83a2e; --grey:#9aa0a6; --blue:#2c5f8a;
  --r:10px; --tap:44px;
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--soft);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #6aa0d8;outline-offset:2px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.35rem} h2{font-size:1.1rem} h3{font-size:.98rem}
a{color:var(--blue)}
.muted{color:var(--mute)} .small{font-size:.82rem} .tiny{font-size:.74rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.hidden{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--ink);color:#e9ebee;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid #3a3f45;margin-bottom:10px}
.brand b{display:block;font-size:1.02rem}
.brand span{font-size:.78rem;color:#aab0b7}
.side button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:#d7dade;padding:10px;border-radius:8px;cursor:pointer;text-align:left;min-height:var(--tap)}
.side button:hover{background:#30353b}
.side button.on{background:#fff;color:var(--ink);font-weight:600}
.side svg,.tabbar svg{width:20px;height:20px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:20}
.top .proj{font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;background:#fff;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey)}
.dot.on{background:var(--green)} .dot.off{background:var(--red)}
.demo-badge{background:#fff4d6;border:1px solid #e6c56a;color:#6b4e00;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:650}
.content{padding:18px;max-width:1280px;width:100%}
.tabbar{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .content{padding:12px 12px 90px}
  .top{padding:8px 12px;flex-wrap:wrap}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mute);min-height:56px}
  .tabbar button.on{color:var(--ink);font-weight:650}
}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card h2{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi .l{font-size:.78rem;color:var(--mute)}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)} .kpi.green .v{color:var(--green)}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* forms */
label.f{display:block;font-size:.8rem;color:var(--ink2);font-weight:600;margin:0 0 4px}
.field{margin-bottom:12px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=password],select,textarea{
  width:100%;min-height:var(--tap);border:1px solid #cfd3d8;border-radius:8px;padding:9px 11px;background:#fff}
textarea{min-height:76px;resize:vertical}
select:disabled,input:disabled{background:var(--soft);color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border-color:#c5c9ce}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.danger{background:#fff;color:var(--red);border-color:#e3b9b4}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:var(--tap);border:1px solid #cfd3d8;background:#fff;border-radius:8px;padding:0 10px;cursor:pointer;font-weight:550}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button[data-s="Completed"].on{background:var(--green);border-color:var(--green)}
.seg button[data-s="Blocked"].on{background:var(--red);border-color:var(--red)}
.seg button[data-s="On Hold"].on{background:var(--amber);border-color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #cfd3d8;background:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;min-height:var(--tap);padding:4px 0}
.check input{width:22px;height:22px}
.pctbig{font-size:2.2rem;font-weight:750;line-height:1}
.searchres{border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff;max-height:280px;overflow:auto}
.searchres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);background:#fff;padding:10px 12px;cursor:pointer}
.searchres button:hover{background:var(--soft)}
.stepper{display:grid;grid-template-columns:1fr;gap:0 10px}
@media (min-width:520px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.stepper{grid-template-columns:repeat(4,minmax(0,1fr))}}
.span-all{grid-column:1/-1}

/* progress */
.bar{height:8px;background:#e7e9ec;border-radius:99px;overflow:hidden;position:relative;min-width:60px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--green2)}
.bar>b{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.bar>s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.h-done{color:var(--green)} .h-ok{color:var(--green)} .h-risk{color:var(--amber)} .h-delayed,.h-blocked{color:var(--red)} .h-ns{color:var(--grey)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:650;border:1px solid transparent;white-space:nowrap}
.tag.done,.tag.ok{background:#e3f1e8;color:#1f5c38;border-color:#bcdcc8}
.tag.risk{background:#fbf0d9;color:#7a5200;border-color:#ecd39b}
.tag.delayed,.tag.blocked{background:#f7e1de;color:#8a2219;border-color:#e8bab4}
.tag.ns{background:#eef0f2;color:#5c6268;border-color:#dcdfe3}
.tag.v-Submitted{background:#e6eef7;color:#24476b} .tag.v-Verified{background:#e3f1e8;color:#1f5c38} .tag.v-Rejected{background:#f7e1de;color:#8a2219} .tag.v-Draft{background:#eef0f2;color:#5c6268}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid #eceef1;text-align:left;vertical-align:middle}
th{background:#f8f9fa;font-weight:650;color:var(--ink2);position:sticky;top:0;z-index:1;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mx td{text-align:center;padding:5px;font-size:.78rem}
.mx td.a{text-align:left;white-space:nowrap}
.cell{display:block;border-radius:5px;padding:4px 2px;font-weight:650;cursor:pointer;min-width:44px}

/* layouts */
.plan{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;position:relative}
.plan svg{display:block;width:100%;height:auto;min-width:640px}
.plan .loc{cursor:pointer}
.plan .loc:hover rect{opacity:.85}
.planwrap{position:relative;display:inline-block;min-width:100%}
.planwrap img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.zbox{position:absolute;border:2px solid var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;font-weight:700;color:#111;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.disclaim{font-size:.76rem;color:#6b4e00;background:#fff8e6;border:1px solid #f0dca6;border-radius:6px;padding:6px 10px;margin-bottom:8px}

/* overlays */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.err{background:var(--red)}
.mask{position:fixed;inset:0;background:rgba(20,22,25,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:980px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:10px}
.login{max-width:440px;margin:8vh auto;padding:0 14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;width:92px}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photos figcaption{font-size:.7rem;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;min-height:var(--tap)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat span{width:22px;height:22px;border-radius:4px;cursor:pointer;display:inline-block}
.list-item{border-bottom:1px solid var(--soft);padding:10px 0}
@media print{.side,.top,.tabbar,.noprint{display:none!important}.content{padding:0}.card{border:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

/* ---------------- storage: IndexedDB key/value with memory fallback ---------------- */
const Store = {
  db: null, mem: {}, ok: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('sitetrack-sha', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; res(); };
        rq.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    if (!this.ok) return Promise.resolve(this.mem[k]);
    return new Promise(res => { const t = this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); });
  },
  set(k, v) {
    if (!this.ok) { this.mem[k] = v; return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  del(k) {
    if (!this.ok) { delete this.mem[k]; return Promise.resolve(); }
    return new Promise(res => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; });
  }
};

function plannedPct(r, onDate) {

}
function locByQuery(q) {
  q = q.toLowerCase().trim(); if (q.length < 2) return [];
  const terms = q.split(/\s+/);
  return allLocs().map(l => { const f = S.idx.loc[l.id].f; const hay = `${f.code} ${f.name} ${l.id} ${l.name} ${l.unitNo || ''} ${l.unitType || ''} ${l.category || ''} ${l.zones.map(z => z.name).join(' ')}`.toLowerCase(); return { l, f, ok: terms.every(t => hay.includes(t)) }; }).filter(x => x.ok).slice(0, 12);
}

  },
  delLoc: el => { const i = S.idx.loc[el.dataset.l]; if (!confirm('Delete ' + i.l.name + '? Its progress records stay in the backup but will no longer show.')) return; i.f.locations = i.f.locations.filter(l => l.id !== i.l.id); logEvent('config', { what: 'Location deleted: ' + i.l.id }); closeModal(); persist(); render(); },

function verify(key, ok, comment, silent) {
  const r = S.records[key]; if (!r || !can('verify')) return;
  const before = r.verification;
  if (ok) Object.assign(r, { verification: 'Verified', verifiedPct: r.pct, verifiedQty: r.actQty ?? null, verifiedBy: S.user.name, verifiedAt: nowISO(), reviewComment: '' });
  else Object.assign(r, { verification: 'Rejected', reviewComment: comment });
  r.version = (r.version || 0) + 1;
  r.history = [...(r.history || []), { ts: nowISO(), user: S.user.name, role: S.user.role, action: ok ? 'Verified' : 'Rejected', changes: { verification: [before, r.verification], verifiedPct: ok ? [null, r.pct] : undefined }, comment }];
  if (!ok || !r.history[r.history.length - 1].changes.verifiedPct) delete r.history[r.history.length - 1].changes.verifiedPct;
  logEvent(ok ? 'verify' : 'reject', { key, status: r.status, pct: r.pct, verification: r.verification, comment });
  if (!silent) { persist(); render(); toast(ok ? 'Verified' : 'Returned to engineer'); }
}

  floorDisc: v => { S.ui.floorDisc = v; render(); },

  regfloor: v => { S.ui.reg.floor = v; S.ui.reg.page = 0; render(); }, regdisc: v => { S.ui.reg.disc = v; S.ui.reg.page = 0; render(); }, regstatus: v => { S.ui.reg.status = v; S.ui.reg.page = 0; render(); },
  regver: v => { S.ui.reg.ver = v; S.ui.reg.page = 0; render(); }, regctr: v => { S.ui.reg.ctr = v; S.ui.reg.page = 0; render(); }, reghealth: v => { S.ui.reg.health = v; S.ui.reg.page = 0; render(); },
  inspSt: v => { S.ui.inspSt = v; render(); },
  irSet: (v, el) => { const r = S.records[el.dataset.k]; const old = r.irStatus; r.irStatus = v; r.version++; r.history.push({ ts: nowISO(), user: S.user.name, action: 'Inspection status changed', changes: { irStatus: [old, v] } }); logEvent('inspection', { key: el.dataset.k, what: r.irRef + ': ' + old + ' → ' + v }); persist(); render(); },

const IN = {
  search: v => { const r = locByQuery(v); $('#qres').innerHTML = r.length ? `<div class="searchres">${r.map(({ l, f }) => `<button data-act="pickLoc" data-l="${l.id}"><b>${esc(f.code)}</b> · ${esc(locLabel(l))} <span class="small muted">${esc(l.unitType || l.category || '')} · ${esc(l.id)}</span></button>`).join('')}</div>` : (v.trim().length >= 2 ? '<div class="small muted" style="margin-top:6px">No matching location.</div>' : ''); },
  planQty: v => { S.draft.planQty = v === '' ? null : +v; refreshPct(); }, actQty: v => { S.draft.actQty = v === '' ? null : +v; refreshPct(); },
  reportAt: v => S.draft.reportAt = v, plannedStart: v => S.draft.plannedStart = v, plannedFinish: v => S.draft.plannedFinish = v, actualStart: v => S.draft.actualStart = v, actualFinish: v => S.draft.actualFinish = v,
  remarks: v => S.draft.remarks = v, consText: v => { S.draft.constraint = Object.assign({}, S.draft.constraint || {}, { text: v }); },
  irRef: v => { S.draft.irRef = v.trim(); const sel = $('select[data-ch="irStatus"]'); if (sel) { sel.disabled = !v.trim(); if (v.trim() && S.draft.irStatus === 'Not Raised') { S.draft.irStatus = 'Submitted'; sel.value = 'Submitted'; } } },

};
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function adminFieldChange(el) {
  const v = el.value; const p = P();
  if (el.dataset.ff) { const f = S.idx.floor[el.dataset.f].f; f[el.dataset.ff] = v; logEvent('config', { what: `Floor ${f.id} ${el.dataset.ff} → ${v}` }); }
  else if (el.dataset.df) { S.idx.disc[el.dataset.df].name = v; }
  else if (el.dataset.af) {
    const a = S.idx.act[el.dataset.a].a; const k = el.dataset.af; const old = JSON.stringify(a[k]);
    if (k === 'weight') a.weight = Math.max(0, +v || 0);
    else if (k === 'roomTypes') a.roomTypes = v.split(',').map(s => s.trim()).filter(Boolean).length ? v.split(',').map(s => s.trim()).filter(Boolean) : ['*'];
    else if (k === 'dependsOn') a.dependsOn = v.split(',').map(s => s.trim()).filter(s => s && S.idx.act[s] && s !== a.id);
    else if (k === 'milestones') a.milestones = v.split(';').map(s => s.trim()).filter(Boolean).map(s => { const [n, w] = s.split(':'); return { name: n.trim(), weight: +w || 0 }; });
    else if (k === 'method') { a.method = v; if (v === 'milestone' && !a.milestones.length) a.milestones = MS_GEN.map(([n, w]) => ({ name: n, weight: w })); }
    else a[k] = v;
    logEvent('config', { what: `Activity ${a.id} ${k}: ${old} → ${JSON.stringify(a[k])}` });
    if (k === 'method' || k === 'name') { persist(); render(); return; }
  }
  else if (el.dataset.cf) { const c = p.contractors.find(x => x.id === el.dataset.c); c[el.dataset.cf] = v; }
  else if (el.dataset.uf) { const u = S.config.users.find(x => x.id === el.dataset.u); u[el.dataset.uf] = v; logEvent('config', { what: `User ${u.name} ${el.dataset.uf} → ${v}` }); }
  else return;
  persist();
}

function routeHash() {
  const m = /#loc=([^&]+)/.exec(location.hash); if (!m || !S.user) return;
  const id = decodeURIComponent(m[1]);
  const proj = S.config.projects.find(p => p.buildings.some(b => b.floors.some(f => f.locations.some(l => l.id === id))));
  if (proj && proj.id !== S.config.activeProjectId) { S.config.activeProjectId = proj.id; render(); }
  setTimeout(() => openLoc(id), 50);
}
if (chan) chan.onmessage = async () => { const keep = S.draft; await reloadFromStore(); S.draft = keep; if (S.user) { S.user = S.config.users.find(u => u.id === S.user.id) || S.user; render(); } };

(async function init() {
  await Store.open();
  await reloadFromStore().catch(() => { });
  if (!S.config || !S.config.projects?.length) {
    const s = buildSeed(); S.config = s.config; S.records = s.records; S.log = []; S.meta = {};
    logEvent('seed', { what: 'Initial data loaded: SHA Residence configuration from the 10-Oct tracker + demonstration project' });
    await persist(true);
  }
  buildIndex(); render();
  const lu = $('#lu'); if (lu && S.meta.lastUser) lu.value = S.meta.lastUser;
  if (!Store.ok) toast('This browser blocked local storage: updates will be lost when the page closes.', true);
})();
